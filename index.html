<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoFlow Monitor — Подключение станции</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D131A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #141C26;
      border: 1px solid #253142;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #14E2B8;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.45;
    }
    a.btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      background: #14E2B8;
      color: #081018;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>EcoFlow Monitor</h1>
    <p id="status">Открываем приложение для подключения станции…</p>
    <a id="openBtn" class="btn" href="#">Открыть в приложении</a>
    <div class="hint">Если приложение не открылось автоматически, нажмите кнопку выше или скопируйте эту ссылку и вставьте её в приложении.</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var data = params.get("data");
      var btn = document.getElementById("openBtn");
      var status = document.getElementById("status");
      if (!data) {
        status.textContent = "Ссылка-приглашение не содержит данных станции.";
        btn.style.display = "none";
        return;
      }
      var deepLink = "ecoflowmonitor://share?data=" + encodeURIComponent(data);
      btn.href = deepLink;
      window.location.replace(deepLink);
    })();
  </script>
</body>
</html>
